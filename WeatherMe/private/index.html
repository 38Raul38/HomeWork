<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <div class="welcome-section">
            <h1 id="welcomeTitle">Welcome Back!</h1>
            <p id="welcomeText">To keep connected with us please login with your personal info</p>
            <button class="sign-in-btn" id="toggleBtn">SIGN IN</button>
        </div>

        <div class="form-section">
            <div class="form active" id="signupForm">
                <h2>Create Account</h2>

                <div class="divider">or use your email for registration</div>

                <form id="registerForm">
                    <div class="form-group">
                        <input type="text" class="form-input" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-input" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-input" placeholder="Password" required>
                    </div>
                    <button type="submit" class="signup-btn">SIGN UP</button>
                </form>
            </div>

            <div class="form" id="signinForm">
                <h2>Sign In</h2>

                <div class="divider">or use your email account</div>

                <form id="loginForm">
                    <div class="form-group">
                        <input type="email" class="form-input" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-input" placeholder="Password" required>
                    </div>
                    <button type="submit" class="signup-btn">SIGN IN</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
