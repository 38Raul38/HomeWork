{% extends "base.html" %}

{% block title %}Success{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-md-8 col-lg-6">
		<div class="card shadow border-0 rounded-4">
			<div class="card-body p-4">
				<div class="alert alert-success mb-4">Form sent successfully.</div>
				<h1 class="h4 mb-3">Thank you</h1>
				<p class="text-muted mb-4">Your message was received.</p>

				<div class="d-flex gap-2 flex-wrap">
					<a href="{% url 'contact_page' %}" class="btn btn-outline-success">Send new message</a>
					<a href="{% url 'notes:notes_list' %}" class="btn btn-outline-primary">Go to notes</a>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
